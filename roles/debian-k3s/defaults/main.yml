---
# Role: debian-k3s
# Baseline for headless Debian 13 boxes that become k3s HA servers (embedded etcd).
# Logical task groups (each has a tag): ssh_keys, packages, headless, power, storage, k3s.

# --- packages ---
debian_k3s_packages:
  - curl
  - ca-certificates
  - gnupg
  - jq
  - lvm2
  - parted
  - xfsprogs
  - e2fsprogs
  - iptables
  - ipset
  - conntrack
  - socat
  - ethtool
  - chrony
  - linux-cpupower
  - python3-kubernetes  # kubernetes.core modules for later bootstrap steps
  - python3-yaml

# Packages that must survive GUI removal + autoremove (would lock us out of the box).
debian_k3s_keep_packages:
  - openssh-server
  - sudo
  - network-manager
  - netplan.io
  - systemd-resolved
  - ifupdown
  - wpasupplicant

# --- headless: anything matching these (dpkg globs) is purged if installed ---
debian_k3s_gui_packages:
  - "task-*-desktop"
  - gnome-shell
  - gdm3
  - lightdm
  - sddm
  - xdm
  - lxdm
  - slick-greeter
  - xfce4
  - xfce4-session
  - plasma-desktop
  - kde-plasma-desktop
  - cinnamon
  - mate-desktop-environment
  - lxde
  - lxqt
  - xserver-xorg-core
  - xwayland

# --- storage ---
# Everything past the OS partitions goes into one LVM VG (OpenEBS Local PV LVM consumes it later).
# An existing VG is NEVER touched. The PV partition is found by GPT partlabel, else created in
# the trailing free space of the disk.
debian_k3s_lvm_disk: /dev/nvme0n1
debian_k3s_lvm_vg: data
debian_k3s_lvm_partlabel: k3s-data
debian_k3s_lvm_min_free_gib: 50
# OS gets exactly this much; everything else in the VG is the kube volume pool.
debian_k3s_os_size_gib: 168
debian_k3s_os_layout:   # must sum to debian_k3s_os_size_gib (k3s data lives in /var, so it is big)
  root: 20g
  var: 80g
  tmp: 4g
  home: 64g

# --- k3s ---
debian_k3s_version: "v1.36.4+k3s1"   # stable channel 2026-09-26; pinned
# Which host bootstraps the cluster (cluster-init: true) vs. joins it. Defaults to the first
# inventory host, but this is an ordinary Ansible variable, not a fixed identity - override it
# with -e debian_k3s_init_host=<hostname> (or in group_vars/host_vars) when that default host is
# the one being rebuilt/reinstalled. k3s.yml refuses to proceed (see its safety-check task) if the
# resolved init host looks fresh while a peer already holds a live cluster, specifically so this
# never gets used by accident to bootstrap a second, competing cluster.
debian_k3s_init_host: "{{ groups['debian_k3s'][0] }}"
debian_k3s_node_ip: "{{ ansible_host }}"
debian_k3s_api_hostname: k3s.amer.dev
debian_k3s_extra_tls_sans: []        # add the API VIP here once picked (Phase 0)
debian_k3s_cluster_cidr: "10.44.0.0/16"
debian_k3s_service_cidr: "10.45.0.0/16"
debian_k3s_cluster_dns: "10.45.0.10"
debian_k3s_kube_reserved: "cpu=1,memory=2Gi"
debian_k3s_system_reserved: "cpu=1,memory=2Gi"
debian_k3s_eviction_hard: "memory.available<1Gi,nodefs.available<10%"
debian_k3s_cpu_weight: 1000
debian_k3s_etcd_snapshot_schedule: "0 */6 * * *"
debian_k3s_etcd_snapshot_retention: 28

# --- longhorn (replicated block storage, deployed by dean-tofu's app-of-apps ApplicationSet) ---
# Longhorn's v1 engine stores replicas as files on a mounted filesystem (it cannot consume a raw
# block device or a PVC), so Ansible carves a dedicated LV out of the storage VG's free extents
# and mounts it at Longhorn's default data path. The Longhorn chart's default disk picks it up.
debian_k3s_longhorn_lv: longhorn
debian_k3s_longhorn_size: 200g
debian_k3s_longhorn_mount: /var/lib/longhorn
debian_k3s_longhorn_packages:
  - open-iscsi
  - nfs-common
  - cryptsetup
  - dmsetup
debian_k3s_longhorn_modules:
  - iscsi_tcp
  - dm_crypt
