---
# Disk layout. Assumes Debian's guided-LVM install: / /var /tmp /home are LVs in one VG.
# The OS LVs are sized to debian_k3s_os_layout; everything else in that VG is the OpenEBS
# Local PV LVM pool for PVCs. Published as the fact `debian_k3s_storage_vg`.
# / /var /tmp grow online. /home cannot shrink while mounted, so it is MIGRATED (new LV, rsync,
# fstab repoint, drain, Ansible-triggered reboot, uncordon, old LV removed). Nothing is ever
# shrunk or wiped in place.
- name: Find the volume group behind each OS mount
  ansible.builtin.shell: lvs --noheadings -o vg_name "$(findmnt -no SOURCE {{ item }})" | tr -d ' '
  loop: ["/", "/var"]
  register: debian_k3s_os_vgs
  changed_when: false
  check_mode: false
  failed_when: false

- name: Require / and /var to be LVs in the same volume group
  ansible.builtin.assert:
    that:
      - debian_k3s_os_vgs.results | map(attribute='stdout') | select | list | length == 2
      - debian_k3s_os_vgs.results | map(attribute='stdout') | unique | list | length == 1
    fail_msg: >-
      / and /var on {{ inventory_hostname }} must both be LVs in one VG (Debian guided-LVM layout).
      Got {{ debian_k3s_os_vgs.results | map(attribute='stdout') | list }}. Nothing was changed.

- name: Storage pool is the OS volume group
  ansible.builtin.set_fact:
    debian_k3s_storage_vg: "{{ debian_k3s_os_vgs.results[0].stdout }}"

- name: Refuse to touch storage if /home is in fstab but not mounted
  ansible.builtin.shell: grep -qE '^[^#]\S+\s+/home\s' /etc/fstab && ! mountpoint -q /home && echo UNMOUNTED || echo ok
  register: debian_k3s_home_mounted
  changed_when: false
  check_mode: false

- name: Fail clearly if /home is not mounted
  ansible.builtin.assert:
    that: debian_k3s_home_mounted.stdout == 'ok'
    fail_msg: "/home is in /etc/fstab but is NOT mounted on {{ inventory_hostname }}; run `mount /home` (or reboot) and re-run. Not touching storage."

- name: Assert the OS layout adds up to the reserved size
  ansible.builtin.assert:
    that: (debian_k3s_os_layout.values() | map('regex_replace', 'g$', '') | map('int') | sum) == (debian_k3s_os_size_gib | int)
    fail_msg: "debian_k3s_os_layout must sum to {{ debian_k3s_os_size_gib }}g"

- name: Look up the LV behind each OS mount
  ansible.builtin.shell: >-
    lvs --noheadings --separator : -o lv_name,vg_name,lv_size --units b --nosuffix "$(findmnt -no SOURCE {{ item }})"
    | tr -d ' '
  loop: ["/", "/var", "/tmp", "/home"]
  register: debian_k3s_mnt_lv
  changed_when: false
  check_mode: false
  failed_when: false

- name: Start with an empty LV index
  ansible.builtin.set_fact:
    debian_k3s_lv: {}

- name: Index OS LVs by mountpoint
  ansible.builtin.set_fact:
    debian_k3s_lv: >-
      {{ debian_k3s_lv | combine({item.item: {'lv': parts[0], 'vg': parts[1], 'size': parts[2] | int}}) }}
  vars:
    parts: "{{ item.stdout.split(':') }}"
  loop: "{{ debian_k3s_mnt_lv.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0 and item.stdout.split(':') | length == 3

- name: Grow / /var /tmp to their target size (grow-only, online, with filesystem)
  community.general.lvol:
    vg: "{{ debian_k3s_lv[item.mp].vg }}"
    lv: "{{ debian_k3s_lv[item.mp].lv }}"
    size: "{{ item.size }}"
    shrink: false
    resizefs: true
  loop:
    - { mp: "/", size: "{{ debian_k3s_os_layout.root }}" }
    - { mp: "/var", size: "{{ debian_k3s_os_layout.var }}" }
    - { mp: "/tmp", size: "{{ debian_k3s_os_layout.tmp }}" }
  when: item.mp in debian_k3s_lv

# --- swap: kubelet needs it off; give the LV back to the pool ---
- name: Read active swap now (facts may predate swapoff)
  ansible.builtin.command: swapon --noheadings --show=NAME
  register: debian_k3s_swap_active
  changed_when: false
  check_mode: false

- name: Find swap LVs in the OS volume group
  ansible.builtin.shell: lvs --noheadings -o lv_name,lv_path -S 'lv_name=~^swap' {{ debian_k3s_lv['/'].vg }} | xargs -n2
  register: debian_k3s_swap_lvs
  changed_when: false
  check_mode: false
  when: "'/' in debian_k3s_lv"

- name: Make initramfs stop looking for a resume (swap) device
  ansible.builtin.copy:
    dest: /etc/initramfs-tools/conf.d/resume
    content: "RESUME=none\n"
    owner: root
    group: root
    mode: "0644"
  register: debian_k3s_resume
  when: debian_k3s_swap_lvs.stdout_lines | default([]) | length > 0

- name: Rebuild initramfs if resume config changed
  ansible.builtin.command: update-initramfs -u
  when: debian_k3s_resume is changed

- name: Remove the (already disabled) swap LVs
  community.general.lvol:
    vg: "{{ debian_k3s_lv['/'].vg }}"
    lv: "{{ item.split()[0] }}"
    state: absent
    force: true
  loop: "{{ debian_k3s_swap_lvs.stdout_lines | default([]) }}"
  when: debian_k3s_swap_active.stdout | trim == ''

# --- /home migration (see header) ---
- name: Work out whether /home still sits on its oversized LV
  ansible.builtin.set_fact:
    debian_k3s_home_target_b: "{{ (debian_k3s_os_layout.home | regex_replace('g$', '') | int) * 1073741824 }}"
    debian_k3s_home_migrate: "{{ '/home' in debian_k3s_lv and (debian_k3s_lv['/home'].size | int) > ((debian_k3s_os_layout.home | regex_replace('g$', '') | int) + 1) * 1073741824 }}"

- name: Has the new home LV already been populated and put in fstab?
  ansible.builtin.shell: |
    u=$(blkid -s UUID -o value /dev/{{ debian_k3s_lv['/home'].vg }}/{{ debian_k3s_lv['/home'].lv }}2 2>/dev/null) && [ -n "$u" ] && grep -q "^UUID=$u /home " /etc/fstab && echo yes || echo no
  register: debian_k3s_home_prepared
  changed_when: false
  check_mode: false
  when: debian_k3s_home_migrate | bool

- name: Migrate /home to a right-sized LV
  when: debian_k3s_home_migrate | bool
  block:
    - name: Prepare the new home LV (skipped once fstab already points at it)
      when: debian_k3s_home_prepared.stdout == 'no'
      block:
        - name: Create the new home LV
          community.general.lvol:
            vg: "{{ debian_k3s_lv['/home'].vg }}"
            lv: "{{ debian_k3s_lv['/home'].lv }}2"
            size: "{{ debian_k3s_os_layout.home }}"
        - name: Install rsync
          ansible.builtin.apt:
            name: rsync
            state: present
        - name: Make the filesystem (never reformats an existing one)
          community.general.filesystem:
            fstype: ext4
            dev: "/dev/{{ debian_k3s_lv['/home'].vg }}/{{ debian_k3s_lv['/home'].lv }}2"
          when: not ansible_check_mode
        - name: Mount it temporarily (not in fstab)
          ansible.posix.mount:
            path: /mnt/home-new
            src: "/dev/{{ debian_k3s_lv['/home'].vg }}/{{ debian_k3s_lv['/home'].lv }}2"
            fstype: ext4
            state: ephemeral
          when: not ansible_check_mode
        - name: Copy /home (preserving owners, ACLs, xattrs, hardlinks)
          ansible.builtin.command: rsync -aHAX --numeric-ids --delete -i /home/ /mnt/home-new/
          register: debian_k3s_home_rsync
          changed_when: debian_k3s_home_rsync.stdout_lines | length > 0
          when: not ansible_check_mode
        - name: Unmount the temporary mount
          ansible.posix.mount:
            path: /mnt/home-new
            state: unmounted
          when: not ansible_check_mode
        - name: Read the new filesystem UUID
          ansible.builtin.command: blkid -s UUID -o value /dev/{{ debian_k3s_lv['/home'].vg }}/{{ debian_k3s_lv['/home'].lv }}2
          register: debian_k3s_home_uuid
          changed_when: false
          when: not ansible_check_mode
        - name: Point /etc/fstab's /home at the new LV (active after the reboot below)
          ansible.builtin.lineinfile:
            path: /etc/fstab
            regexp: '^\S+\s+/home\s'
            line: "UUID={{ debian_k3s_home_uuid.stdout }} /home ext4 defaults 0 2"
          when: not ansible_check_mode
        - name: Tell systemd about the new fstab
          ansible.builtin.systemd:
            daemon_reload: true

    # /home cannot switch onto the new LV while the old one is mounted underneath it. Sole carve-out
    # to the "never reboot" rule (see CLAUDE.md) - one host at a time (the play's serial: 1), waiting
    # for the host to come back and verifying /home before moving on. The facts refreshed just below
    # are what let the existing "Finish the /home migration" block (unchanged, further down this
    # file) run its old-LV cleanup in this SAME invocation instead of a second, manually-triggered run.
    - name: Is k3s running?
      ansible.builtin.command: systemctl is-active k3s
      register: debian_k3s_active
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Drain before the reboot
      when: debian_k3s_active.rc == 0
      block:
        - name: Leave a marker so a re-run knows this play cordoned the node
          ansible.builtin.file:
            path: "{{ debian_k3s_drain_marker }}"
            state: touch
            mode: "0644"
        - name: Drain
          ansible.builtin.command: >-
            k3s kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data
            --timeout={{ debian_k3s_drain_timeout }}
          changed_when: true
      rescue:
        - name: Uncordon after a failed drain
          ansible.builtin.command: k3s kubectl uncordon {{ inventory_hostname }}
          changed_when: true
        - name: Clear the marker
          ansible.builtin.file:
            path: "{{ debian_k3s_drain_marker }}"
            state: absent
        - name: Stop here
          ansible.builtin.fail:
            msg: >-
              Drain of {{ inventory_hostname }} did not finish in {{ debian_k3s_drain_timeout }}.
              Uncordoned, no reboot. The new home LV is prepared and in fstab; it takes effect on
              the next successful run.

    - name: Reboot to switch /home onto the new LV (Ansible-triggered, one host at a time)
      ansible.builtin.reboot:
        reboot_timeout: 300
        connect_timeout: 10
        test_command: mountpoint -q /home
        msg: "Rebooting {{ inventory_hostname }} to switch /home onto its right-sized LV (Ansible-triggered)"

    - name: Re-gather facts after the reboot
      ansible.builtin.setup:

    - name: Re-check the LV behind /home now that the reboot switched it
      ansible.builtin.shell: >-
        lvs --noheadings --separator : -o lv_name,vg_name,lv_size --units b --nosuffix "$(findmnt -no SOURCE /home)"
        | tr -d ' '
      register: debian_k3s_home_lv_after_reboot
      changed_when: false
      check_mode: false

    - name: Refresh the /home LV+migrate facts so the cleanup block below sees the post-reboot state
      ansible.builtin.set_fact:
        debian_k3s_lv: "{{ debian_k3s_lv | combine({'/home': {'lv': home_parts[0], 'vg': home_parts[1], 'size': home_parts[2] | int}}) }}"
        debian_k3s_home_migrate: "{{ (home_parts[2] | int) > ((debian_k3s_os_layout.home | regex_replace('g$', '') | int) + 1) * 1073741824 }}"
      vars:
        home_parts: "{{ debian_k3s_home_lv_after_reboot.stdout.split(':') }}"

- name: Did this play cordon the node?
  ansible.builtin.stat:
    path: "{{ debian_k3s_drain_marker }}"
  register: debian_k3s_drain_marker_stat

- name: Bring the node back into the cluster
  when: debian_k3s_drain_marker_stat.stat.exists
  block:
    - name: Wait for the node to be Ready
      ansible.builtin.command: k3s kubectl wait node/{{ inventory_hostname }} --for=condition=Ready --timeout=60s
      register: debian_k3s_node_ready
      retries: 20
      delay: 15
      until: debian_k3s_node_ready.rc == 0
      changed_when: false
    - name: Uncordon
      ansible.builtin.command: k3s kubectl uncordon {{ inventory_hostname }}
      changed_when: true
    - name: Clear the marker
      ansible.builtin.file:
        path: "{{ debian_k3s_drain_marker }}"
        state: absent

# NOTE: the new LV keeps the name `<home>2`. Do NOT lvrename a mounted LV: udev recreates the device node and
# systemd can unmount /home behind our back (seen on 3 hosts: sessions dropped, ~/.ssh vanished, key login refused).
- name: Finish the /home migration after the reboot
  when: not (debian_k3s_home_migrate | bool) and '/home' in debian_k3s_lv and debian_k3s_lv['/home'].lv is match('^.+2$')
  block:
    - name: Is the old home LV still there?
      ansible.builtin.stat:
        path: "/dev/{{ debian_k3s_lv['/home'].vg }}/{{ debian_k3s_lv['/home'].lv[:-1] }}"
      register: debian_k3s_old_home
    - name: Remove the old, unmounted home LV
      community.general.lvol:
        vg: "{{ debian_k3s_lv['/home'].vg }}"
        lv: "{{ debian_k3s_lv['/home'].lv[:-1] }}"
        state: absent
        force: true
      when: debian_k3s_old_home.stat.exists

- name: Re-read free space in the storage VG
  ansible.builtin.command: vgs --noheadings --units b --nosuffix -o vg_free {{ debian_k3s_storage_vg }}
  register: debian_k3s_pool_free_after
  changed_when: false
  check_mode: false

- name: Report the storage pool for kube volumes
  ansible.builtin.debug:
    msg: >-
      Kube volume pool: VG '{{ debian_k3s_storage_vg }}', {{ ((debian_k3s_pool_free_after.stdout | trim | int) / 1073741824) | round(1) }} GiB free
      (OpenEBS LVM StorageClass vgpattern = ^{{ debian_k3s_storage_vg }}$).

- name: journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    mode: "0755"

- name: Cap the journal size (log rotation)
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse={{ debian_k3s_journald_max_use }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
