---
- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ debian_k3s_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

- name: Load kernel modules at boot (k3s + OpenEBS LVM)
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: |
      overlay
      br_netfilter
      dm_snapshot
      dm_thin_pool
    owner: root
    group: root
    mode: "0644"
  register: debian_k3s_modules_conf

- name: Load kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter, dm_snapshot, dm_thin_pool]

- name: Kernel sysctls for k3s / Cilium
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: net.ipv4.ip_forward, value: "1" }
    - { name: net.ipv6.conf.all.forwarding, value: "1" }
    - { name: fs.inotify.max_user_watches, value: "1048576" }
    - { name: fs.inotify.max_user_instances, value: "8192" }

# rp_filter is owned by Cilium (/etc/sysctl.d/99-zzz-override_cilium.conf sets all.rp_filter=0);
# managing it here would flip it back on every run.
- name: Drop rp_filter lines from our sysctl file (Cilium owns them)
  ansible.builtin.lineinfile:
    path: /etc/sysctl.d/90-k3s.conf
    regexp: '^net\.ipv4\.conf\.(all|default)\.rp_filter'
    state: absent

# kubelet refuses to start with swap on (and swap hurts etcd latency).
- name: Turn swap off now
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0

- name: Comment out swap in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n].*\sswap\s.*)$'
    replace: '# \1  # disabled by ansible (k3s)'
