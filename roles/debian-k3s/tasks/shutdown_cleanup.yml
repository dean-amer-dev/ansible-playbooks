---
# Stop the containers k3s leaves running (KillMode=process) in an orderly, logged way at shutdown,
# instead of leaving them to systemd's final kill stage. See templates/k3s-shutdown-cleanup.sh.j2.
- name: Install bc (timestamps in the cleanup script)
  ansible.builtin.apt:
    name: bc
    state: present

- name: Install shutdown cleanup script
  ansible.builtin.template:
    src: k3s-shutdown-cleanup.sh.j2
    dest: /usr/local/sbin/k3s-shutdown-cleanup
    owner: root
    group: root
    mode: "0755"

- name: Install shutdown cleanup unit
  ansible.builtin.template:
    src: k3s-shutdown-cleanup.service.j2
    dest: /etc/systemd/system/k3s-shutdown-cleanup.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Flush handlers so the unit is known
  ansible.builtin.meta: flush_handlers

# enabled + started: ExecStart is /bin/true with RemainAfterExit, so "started" only arms the ExecStop.
- name: Enable and arm the unit
  ansible.builtin.systemd:
    name: k3s-shutdown-cleanup.service
    enabled: true
    state: started

# Boot side of the same problem: network-online.target is reached before lan0 has carrier and its address
# (ifup@lan0 is still "waiting for carrier"), so k3s's first start dies with "bind: cannot assign requested
# address" and only succeeds after RestartSec. Hold k3s until the node IP is really configured.
- name: Make k3s wait for its node IP before the first start
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/20-wait-for-node-ip.conf
    content: |
      [Service]
      ExecStartPre=/usr/bin/timeout 60 /bin/sh -c 'until ip -o -4 addr show | grep -q " {{ debian_k3s_node_ip }}/"; do sleep 0.5; done'
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd
