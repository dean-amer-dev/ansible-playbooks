---
# SAFETY CHECK, runs first: refuse to render cluster-init:true for a fresh/rebuilt init host when a
# peer in this group already holds a live cluster. Without this, rebuilding whichever host happens
# to sit in debian_k3s_init_host's inventory slot would silently bootstrap a SECOND, competing
# cluster instead of rejoining the real one - split-brain at best, silently replacing the live
# cluster at worst. debian_k3s_init_host is an ordinary variable (defaults/main.yml): if this check
# fires, re-run with -e debian_k3s_init_host=<a surviving peer> rather than overriding the check.
- name: Init-host safety check
  when: inventory_hostname == debian_k3s_init_host
  block:
    - name: Does this host already have existing k3s server data (i.e. it is not actually fresh)?
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/db
      register: debian_k3s_init_has_data

    - name: If this host looks fresh, check whether any peer already has a live cluster
      ansible.builtin.command: k3s kubectl get --raw /readyz
      delegate_to: "{{ item }}"
      loop: "{{ groups['debian_k3s'] | difference([debian_k3s_init_host]) }}"
      loop_control:
        label: "{{ item }}"
      register: debian_k3s_peer_readyz
      changed_when: false
      failed_when: false
      when: not debian_k3s_init_has_data.stat.exists

    - name: Refuse to bootstrap a new cluster here - a peer already has a live one
      vars:
        debian_k3s_live_peers: "{{ debian_k3s_peer_readyz.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
      ansible.builtin.fail:
        msg: >-
          {{ debian_k3s_init_host }} is configured as the init host (cluster-init: true) but has no
          existing k3s server data - it looks freshly (re)installed. {{ debian_k3s_live_peers }}
          already answers a live k3s API, meaning a real cluster exists without this host.
          Rendering cluster-init:true here would bootstrap a SECOND, competing cluster and risk
          split-brain or replacing the real one. Re-run with
          -e debian_k3s_init_host=<one of {{ debian_k3s_live_peers }}> to pick a surviving node as
          the init host instead, so {{ debian_k3s_init_host }} rejoins as a normal member.
      when:
        - not debian_k3s_init_has_data.stat.exists
        - debian_k3s_peer_readyz.results | default([]) | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list | length > 0

- name: Resolve join token
  ansible.builtin.set_fact:
    debian_k3s_token: "{{ debian_k3s_token | default('') }}"
  no_log: true

- name: Joiner without a BWS token reads the token the init host generated
  when: inventory_hostname != debian_k3s_init_host and debian_k3s_token | length == 0
  block:
    - name: Read token from init host
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/token
      delegate_to: "{{ debian_k3s_init_host }}"
      register: debian_k3s_init_token
      no_log: true

    - name: Use it
      ansible.builtin.set_fact:
        debian_k3s_token: "{{ debian_k3s_init_token.content | b64decode | trim }}"
      no_log: true

- name: Read installed k3s version
  ansible.builtin.command: k3s --version
  register: debian_k3s_installed
  changed_when: false
  failed_when: false

- name: Fetch k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/share/k3s-install.sh
    mode: "0755"
  when: debian_k3s_version not in debian_k3s_installed.stdout

- name: Install pinned k3s (server, not started yet)
  ansible.builtin.command: /usr/local/share/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ debian_k3s_version }}"
    INSTALL_K3S_EXEC: server
    INSTALL_K3S_SKIP_START: "true"
  when: debian_k3s_version not in debian_k3s_installed.stdout

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write k3s config
  ansible.builtin.template:
    src: k3s-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  register: debian_k3s_config
  no_log: true

- name: Ensure k3s.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Give k3s top CPU weight
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/10-cpuweight.conf
    content: |
      [Service]
      CPUWeight={{ debian_k3s_cpu_weight }}
    owner: root
    group: root
    mode: "0644"
  register: debian_k3s_dropin

- name: Reload systemd if the drop-in changed
  ansible.builtin.systemd:
    daemon_reload: true
  when: debian_k3s_dropin is changed

- name: Was k3s already running?
  ansible.builtin.command: systemctl is-active k3s
  register: debian_k3s_was_active
  changed_when: false
  failed_when: false

- name: Joiner waits for the init host API
  ansible.builtin.wait_for:
    host: "{{ hostvars[debian_k3s_init_host].debian_k3s_node_ip | default(hostvars[debian_k3s_init_host].ansible_host) }}"
    port: 6443
    timeout: 300
  when: inventory_hostname != debian_k3s_init_host and debian_k3s_was_active.stdout != 'active'

- name: Enable and start k3s
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Restart k3s only if config/drop-in changed on an already-running node
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when: debian_k3s_was_active.stdout == 'active' and (debian_k3s_config is changed or debian_k3s_dropin is changed)

- name: Wait for the API server to report ready (includes the etcd check)
  ansible.builtin.command: k3s kubectl get --raw '/readyz?verbose'
  register: debian_k3s_ready
  retries: 30
  delay: 10
  until: debian_k3s_ready.rc == 0
  changed_when: false

- name: Assert etcd healthy
  ansible.builtin.assert:
    that: "'[+]etcd ok' in debian_k3s_ready.stdout"
