---
# Rename the LAN NIC to the literal name `lan0` (Cilium devices, L2 announcements and kube-vip all key off it).
# The rename is a systemd .link file matched by MAC, so it survives kernel/driver changes; it takes effect at the
# next boot. Anything that refers to the NIC BY NAME must follow it, or the box boots with no network:
#   - ifupdown (/etc/network/interfaces): rewritten here
#   - NetworkManager: only OK if the active profile is not bound to an interface name (asserted here)
# Addressing is unchanged (DHCP reservation, same IPs); static IP / public resolvers are a separate change.

- name: Find the NIC that carries the node IP
  ansible.builtin.set_fact:
    debian_k3s_nic_facts: "{{ ansible_facts[ansible_facts.default_ipv4.interface | replace('-', '_')] }}"

- name: Assert the default-route NIC really is the one with the node IP (never rename a guess)
  ansible.builtin.assert:
    that:
      - ansible_facts.default_ipv4.address == debian_k3s_node_ip
      - debian_k3s_nic_facts.macaddress | regex_search('^([0-9a-f]{2}:){5}[0-9a-f]{2}$') is not none
    fail_msg: "default-route NIC {{ ansible_facts.default_ipv4.interface }} does not carry {{ debian_k3s_node_ip }}"

- name: Install the .link file that names the NIC lan0 (matched by MAC)
  ansible.builtin.copy:
    dest: /etc/systemd/network/10-lan0.link
    content: |
      # Managed by Ansible (role debian-k3s)
      [Match]
      MACAddress={{ debian_k3s_nic_facts.macaddress }}

      [Link]
      Name=lan0
    owner: root
    group: root
    mode: "0644"
  register: debian_k3s_lan0_link

- name: Does ifupdown configure the NIC?
  ansible.builtin.stat:
    path: /etc/network/interfaces
  register: debian_k3s_ifupdown

- name: Point ifupdown stanzas at lan0 (old name would leave lan0 unconfigured after the rename)
  ansible.builtin.replace:
    path: /etc/network/interfaces
    regexp: '\b{{ debian_k3s_nic_facts.device }}\b'
    replace: lan0
  when: debian_k3s_ifupdown.stat.exists and debian_k3s_nic_facts.device != 'lan0'

- name: Is NetworkManager managing this NIC?
  ansible.builtin.command: nmcli -t -f NAME,DEVICE connection show --active
  register: debian_k3s_nm_active
  changed_when: false
  failed_when: false

- name: NetworkManager profile bound to the NIC by name would lose the network after the rename
  ansible.builtin.command: nmcli -g connection.interface-name connection show "{{ item.split(':')[0] }}"
  register: debian_k3s_nm_bound
  changed_when: false
  failed_when: debian_k3s_nm_bound.stdout | trim | length > 0
  loop: "{{ debian_k3s_nm_active.stdout_lines | select('search', ':' ~ debian_k3s_nic_facts.device ~ '$') | list }}"
  when: debian_k3s_nic_facts.device != 'lan0'

- name: Nothing else in /etc/network or NetworkManager may still name the old interface
  ansible.builtin.shell: grep -rIl -w '{{ debian_k3s_nic_facts.device }}' /etc/network /etc/NetworkManager 2>/dev/null || true
  register: debian_k3s_old_name_refs
  changed_when: false
  failed_when: debian_k3s_old_name_refs.stdout | trim | length > 0
  when: debian_k3s_nic_facts.device != 'lan0'

- name: Dry-run udev - which link file will name this NIC at next boot?
  ansible.builtin.command: udevadm test-builtin net_setup_link /sys/class/net/{{ debian_k3s_nic_facts.device }}
  register: debian_k3s_udev_test
  changed_when: false

- name: Assert udev will pick our file (it names the NIC lan0)
  ansible.builtin.assert:
    that:
      - "'ID_NET_LINK_FILE=/etc/systemd/network/10-lan0.link' in debian_k3s_udev_test.stdout"
    fail_msg: "udev would not rename to lan0: {{ debian_k3s_udev_test.stdout }}"
  when: debian_k3s_nic_facts.device != 'lan0'

- name: Report
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: NIC {{ debian_k3s_nic_facts.device }} ({{ debian_k3s_nic_facts.macaddress }}) ->
      {{ 'already lan0' if debian_k3s_nic_facts.device == 'lan0' else 'becomes lan0 at next reboot (ONE node at a time)' }}
