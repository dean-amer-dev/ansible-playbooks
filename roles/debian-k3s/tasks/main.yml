---
- name: Assert target is Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] | int >= 13
    fail_msg: "debian-k3s targets Debian 13+, got {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"
  tags: [always]

- name: Set hostname to inventory name (k3s node name derives from it)
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: [always]

- name: Keep /etc/hosts in step with the hostname (else sudo warns "unable to resolve host")
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"
  tags: [always]

- name: SSH keys
  ansible.builtin.import_tasks: ssh_keys.yml
  tags: [ssh_keys]

- name: Packages, time sync, kernel modules and sysctls
  ansible.builtin.import_tasks: packages.yml
  tags: [packages]

- name: Kernel crash dumps (kdump); never reboots, reports a pending reboot
  ansible.builtin.import_tasks: kdump.yml
  tags: [kdump]

- name: Headless (remove GUI) and disable auto-sleep
  ansible.builtin.import_tasks: headless.yml
  tags: [headless]

- name: Performance power mode
  ansible.builtin.import_tasks: power.yml
  tags: [power]

- name: LVM volume group for kube volumes
  ansible.builtin.import_tasks: storage.yml
  tags: [storage]

- name: Longhorn prerequisites + dedicated data LV
  ansible.builtin.import_tasks: longhorn.yml
  tags: [longhorn]

- name: NIC rename to lan0 (effective at next boot)
  ansible.builtin.import_tasks: network.yml
  tags: [network]

- name: Preflight - is this node ready for k3s?
  ansible.builtin.import_tasks: preflight.yml
  tags: [preflight, k3s]

- name: k3s server
  ansible.builtin.import_tasks: k3s.yml
  tags: [k3s]

- name: Cilium CNI
  ansible.builtin.import_tasks: cilium.yml
  tags: [cilium]

- name: CoreDNS cluster DNS
  ansible.builtin.import_tasks: coredns.yml
  tags: [coredns]

- name: kube-vip control-plane VIP
  ansible.builtin.import_tasks: kube-vip.yml
  tags: [kube-vip]

- name: ArgoCD (GitOps controller) + bitwarden-credentials bootstrap secret
  ansible.builtin.import_tasks: argocd.yml
  tags: [argocd]

- name: Static IP + public DNS resolvers (codifies the existing DHCP reservation)
  ansible.builtin.import_tasks: static-ip.yml
  tags: [static-ip]
