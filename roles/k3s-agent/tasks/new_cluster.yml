---
# this host as a worker in the Infrastructure 2.0 cluster.
# Never reboots. Sequencing: the agent only starts once the NIC is named lan0 (Cilium devices: lan0)
# and the legacy agent state (old cluster CA, certs, kubeconfigs) has been moved aside.
# The join token is read from the init server by the playbook's first play (never printed, never in git).

- name: Name the LAN NIC lan0
  ansible.builtin.include_tasks: new_cluster_network.yml

- name: Host sysctls Cilium needs (src_valid_mark)
  ansible.builtin.include_tasks: new_cluster_cilium_host.yml

- name: Require the join token fact (set by the first play; do not run with --limit this host)
  ansible.builtin.assert:
    that: k3s_agent_nc_join_token is defined and k3s_agent_nc_join_token | length > 0
    fail_msg: "k3s_agent_nc_join_token missing: run the whole playbook, not --limit this host"
  no_log: true

- name: Read installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_agent_nc_installed
  changed_when: false
  failed_when: false

- name: Fetch k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/share/k3s-install.sh
    mode: "0755"
  when: k3s_agent_nc_version not in k3s_agent_nc_installed.stdout

- name: Install pinned k3s (agent, not started)
  ansible.builtin.command: /usr/local/share/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_agent_nc_version }}"
    INSTALL_K3S_EXEC: agent
    INSTALL_K3S_SKIP_START: "true"
  when: k3s_agent_nc_version not in k3s_agent_nc_installed.stdout

# --- is there legacy (old-cluster) agent state to retire? ---
- name: Read the join marker in the data dir
  ansible.builtin.slurp:
    src: "{{ k3s_agent_nc_data_dir }}/.joined-server"
  register: k3s_agent_nc_join_marker
  failed_when: false

- name: Does the data dir exist?
  ansible.builtin.stat:
    path: "{{ k3s_agent_nc_data_dir }}"
  register: k3s_agent_nc_data_dir_stat

- name: Decide whether the data dir belongs to another cluster
  ansible.builtin.set_fact:
    k3s_agent_nc_legacy_state: >-
      {{ k3s_agent_nc_data_dir_stat.stat.exists and
         (k3s_agent_nc_join_marker.content | default('') | b64decode | trim) != k3s_agent_nc_server }}

- name: Retire legacy agent state (stop and disable the agent so a reboot cannot start it on stale certs)
  ansible.builtin.systemd:
    name: k3s-agent
    state: stopped
    enabled: false
  when: k3s_agent_nc_legacy_state | bool

- name: Are there mounts left under the legacy data dir (pods of the dead cluster)?
  ansible.builtin.shell: "findmnt -rn -o TARGET | grep -c '^{{ k3s_agent_nc_data_dir }}/' || true"
  register: k3s_agent_nc_legacy_mounts
  changed_when: false
  when: k3s_agent_nc_legacy_state | bool

- name: Move the legacy data dir and SSD meta.db dir aside (kept, never deleted)
  when:
    - k3s_agent_nc_legacy_state | bool
    - (k3s_agent_nc_legacy_mounts.stdout | default('1') | trim) == '0'
  block:
    - name: Move data dir aside
      ansible.builtin.command: "mv {{ k3s_agent_nc_data_dir }} {{ k3s_agent_nc_data_dir }}.legacy-{{ ansible_date_time.date }}"
      args:
        creates: "{{ k3s_agent_nc_data_dir }}.legacy-{{ ansible_date_time.date }}"

- name: Report pending legacy retirement
  ansible.builtin.debug:
    msg: >-
      Legacy agent state still has active mounts under {{ k3s_agent_nc_data_dir }} (dead-cluster pods).
      Alex reboots, then re-run this playbook to finish retiring it and start the agent.
  when:
    - k3s_agent_nc_legacy_state | bool
    - (k3s_agent_nc_legacy_mounts.stdout | default('1') | trim) != '0'

- name: Re-check for legacy state (it may just have been moved aside)
  ansible.builtin.stat:
    path: "{{ k3s_agent_nc_data_dir }}"
  register: k3s_agent_nc_data_dir_after

- name: Legacy state is still pending only if the dir is still there without our marker
  ansible.builtin.set_fact:
    k3s_agent_nc_legacy_pending: >-
      {{ k3s_agent_nc_data_dir_after.stat.exists and
         (k3s_agent_nc_join_marker.content | default('') | b64decode | trim) != k3s_agent_nc_server }}

# --- desired state ---
- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write k3s agent config.yaml
  ansible.builtin.template:
    src: k3s-agent-new-cluster-config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  register: k3s_agent_nc_config

# The installer-created env file carried K3S_URL/K3S_TOKEN of the old cluster and env beats config.yaml.
- name: Neutralise k3s-agent.service.env (config.yaml is the only source of server/token)
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s-agent.service.env
    content: "# Managed by Ansible (role k3s-agent). Server and token live in /etc/rancher/k3s/config.yaml.\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true  # --diff would print the previous file, which holds a join token

- name: Create fresh data dir and record which cluster it belongs to
  when: not (k3s_agent_nc_legacy_pending | bool)
  block:
    - name: Data dir
      ansible.builtin.file:
        path: "{{ k3s_agent_nc_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Record which cluster this data dir belongs to
      ansible.builtin.copy:
        dest: "{{ k3s_agent_nc_data_dir }}/.joined-server"
        content: "{{ k3s_agent_nc_server }}\n"
        owner: root
        group: root
        mode: "0644"

- name: Forward 127.0.0.1:6443 to the API VIP (Cilium on a worker expects a local apiserver)
  ansible.builtin.include_role:
    name: ../../roles/k3s-agent-apiserver-proxy
  vars:
    k3s_apiserver_proxy_upstream: "{{ k3s_agent_nc_server | regex_replace('^https?://', '') }}"

- name: Gather current interfaces
  ansible.builtin.setup:
    gather_subset: [network]

- name: Enable and start the agent only when it is safe (NIC named lan0, legacy state retired)
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
    daemon_reload: true
  when:
    - k3s_agent_nc_lan_nic_name in ansible_facts.interfaces
    - not (k3s_agent_nc_legacy_pending | bool)

- name: Restart the agent if its config changed
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when:
    - k3s_agent_nc_config is changed
    - k3s_agent_nc_lan_nic_name in ansible_facts.interfaces
    - not (k3s_agent_nc_legacy_pending | bool)

- name: Report agent not started
  ansible.builtin.debug:
    msg: "k3s-agent NOT started: NIC is not yet named {{ k3s_agent_nc_lan_nic_name }} and/or legacy state is pending. Alex reboots, then re-run."
  when: (k3s_agent_nc_lan_nic_name not in ansible_facts.interfaces) or (k3s_agent_nc_legacy_pending | bool)
