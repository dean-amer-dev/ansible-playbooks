---
- name: Run the read-only health gate (pre)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/cluster_health.py"
      - --kubeconfig
      - "{{ rolling_reboot_kubeconfig }}"
      - --phase
      - pre
      - --target
      - "{{ inventory_hostname }}"
      - --min-elsewhere
      - "{{ rolling_reboot_min_healthy_replicas }}"
      - --services
      - "{{ rolling_reboot_replica_services | to_json }}"
      - --ignore-pods
      - "{{ rolling_reboot_ignore_pods | to_json }}"
  delegate_to: localhost
  become: false
  register: rolling_reboot_gate
  failed_when: false
  changed_when: false

- name: Refuse to reboot {{ inventory_hostname }} unless the gate passed
  ansible.builtin.fail:
    msg: >-
      NOT rebooting {{ inventory_hostname }}:
      {{ (rolling_reboot_gate.stdout | from_json).failures | default([rolling_reboot_gate.stdout]) | join('; ') }}
  when: rolling_reboot_gate.rc != 0

- name: Remember what the gate saw (Postgres primary placement)
  ansible.builtin.set_fact:
    rolling_reboot_gate_info: "{{ rolling_reboot_gate.stdout | from_json }}"
