---
# Host sysctls Cilium needs on murderbot. Cilium marks pod replies 0x200 so they reach its Envoy;
# with src_valid_mark=1 the kernel's reverse-path check applies that mark, resolves the pod
# address through Cilium's local table and silently drops the reply, so every connection from
# murderbot to a Cilium-ingress VIP times out (503). tailscaled sets it to 1 when it runs.

- name: Keep net.ipv4.conf.all.src_valid_mark at 0 (persisted and live)
  ansible.posix.sysctl:
    name: net.ipv4.conf.all.src_valid_mark
    value: "0"
    sysctl_file: /etc/sysctl.d/91-cilium-src-valid-mark.conf
    sysctl_set: true
    state: present
    reload: true

- name: Read the live value
  ansible.builtin.slurp:
    src: /proc/sys/net/ipv4/conf/all/src_valid_mark
  register: gpu_worker_src_valid_mark

- name: Assert the live value is 0
  ansible.builtin.assert:
    that: (gpu_worker_src_valid_mark.content | b64decode | trim) == "0"
    fail_msg: "src_valid_mark is not 0 - something (tailscaled?) set it again; Cilium VIP access from this node will 503"
