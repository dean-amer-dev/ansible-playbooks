---
# Hosts in [debian_k3s]. Role defaults live in roles/debian-k3s/defaults/main.yml.
# No secrets here - BWS only (these UUIDs are identifiers, not secrets).
ansible_user: alex
debian_k3s_user: "{{ ansible_user }}"

# BWS secrets (project: servers)
debian_k3s_bws_ssh_private_key_id: "fb0a8c45-a020-4c71-b92f-b44000fbac08"  # alex-id-ed25519-private-key
debian_k3s_bws_ssh_public_key_id: "79f4be07-afcf-48e2-b802-b44000fbc272"   # alex-id-ed25519-public-key

# Deliberately empty - see incident 2026-09-27: this cluster was already bootstrapped with k3s's
# own auto-generated token, which also encrypts data already in etcd. Setting an explicit token
# here retroactively broke gmktec-1 (k3s refused to start: "bootstrap data already found and
# encrypted with different token"). A static BWS-stored token only makes sense at genuine
# first-bootstrap time (a from-scratch cluster rebuild), never injected uniformly into an
# already-live cluster's ongoing config. The debian-k3s-join-token BWS secret still exists for
# that future from-scratch scenario - it must NOT be wired back in here for this running cluster.
# Existing joiners already work fine without this: they read the real token from the init host
# directly (k3s.yml's "Joiner without a BWS token reads the token the init host generated").
debian_k3s_token_bws_id: ""

# --- etcd snapshots to GCS, reusing the existing backup credentials (see
# reference_backup_infra_gcs_bucket - same bucket/creds as other backup jobs, just a dedicated
# folder prefix). BWS secret UUIDs, not secrets themselves.
debian_k3s_bws_backup_access_key_id: "af4a292f-1f9f-45b1-9c56-b37300df69dc"   # k3s-dean-backups-access-key
debian_k3s_bws_backup_secret_key_id: "d2d87681-b2e3-4a3e-b821-b37300df7ce5"   # k3s-dean-backups-secret-key
debian_k3s_bws_backup_endpoint_id: "2c95ebd0-9330-455b-abbd-b37300e580b0"     # k3s-dean-backups-endpoint
debian_k3s_etcd_s3_bucket: "amerenda-backups"
debian_k3s_etcd_s3_folder: "k3s-dean-etcd"

# Passwordless sudo for alex on these nodes (drop-in /etc/sudoers.d, visudo-validated).
debian_k3s_passwordless_sudo: false

# API VIP (kube-vip, added later) - in k3s tls-san so the serving cert is valid for it from the start.
# Lives in the "k3s Reserved" block 10.100.20.161-200 (outside DHCP .40-.160 and the legacy MetalLB pools .201-.250).
debian_k3s_api_vip: "10.100.20.161"
debian_k3s_extra_tls_sans:
  - "{{ debian_k3s_api_vip }}"

# --- Static IP + public DNS resolvers (codifies the existing DHCP reservation, see static-ip.yml) ---
# Matches the household convention already used for laptops/RPis (set-static-ip.yml, setup-rpi.yml).
debian_k3s_static_gateway: "10.100.20.1"
debian_k3s_static_netmask: "255.255.255.0"
debian_k3s_static_dns:
  - "1.1.1.1"
  - "8.8.8.8"

# --- Cilium (CNI, kube-proxy replacement, L2 LoadBalancer announcements) ---
debian_k3s_helm_version: "v3.21.0"
debian_k3s_cilium_cli_version: "v0.20.1"
debian_k3s_cilium_chart_version: "1.20.2"
debian_k3s_lb_pool_start: "10.100.20.170"
debian_k3s_lb_pool_stop: "10.100.20.189"
debian_k3s_lan_interface: lan0
debian_k3s_cilium_values:
  k8sServiceHost: "127.0.0.1"
  k8sServicePort: 6443
  kubeProxyReplacement: true
  ipam:
    mode: kubernetes
  routingMode: native
  ipv4NativeRoutingCIDR: "{{ debian_k3s_cluster_cidr }}"
  autoDirectNodeRoutes: true
  bpf:
    masquerade: true
  devices: "{{ debian_k3s_lan_interface }}"
  l2announcements:
    enabled: true
  # No Traefik/nginx on this cluster (k3s built with servicelb/traefik disabled) - Cilium itself is
  # the Ingress controller. shared mode: one LoadBalancer Service/IP fronts every Ingress object
  # (conserves the small LB pool above), vs. one IP per Ingress under "dedicated".
  ingressController:
    enabled: true
    loadbalancerMode: shared
    default: true
  # Required alongside ingressController.enabled - without it the operator never registers the
  # CiliumEnvoyConfig/CiliumClusterwideEnvoyConfig CRDs, even though the agent-level
  # enable-envoy-config flag is on regardless. Found 2026-09-29: a cilium-agent pod that cold-
  # starts (not just keeps running from initial install) blocks forever at "Still waiting for
  # Cilium Operator to register CRDs" because those CRDs don't exist - agents that were already
  # running from the original install were unaffected, so this went unnoticed until gmktec-3's
  # agent got restarted to fix an unrelated L2-announcement ARP failure. Any future agent restart
  # on any node (reboot, crash, upgrade) hits the same wall without this.
  envoyConfig:
    enabled: true
  # loadBalancer.l7.backend was still "disabled" even with envoyConfig.enabled - both are required
  # together for Cilium's Ingress feature per its own official `cilium install` reference
  # (envoyConfig.enabled=true + loadBalancer.l7.backend=envoy). This was the actual missing piece;
  # envoyConfig.enabled alone updated the ConfigMap but never got the operator to register the
  # CRDs.
  loadBalancer:
    l7:
      backend: envoy
  externalIPs:
    enabled: false
  k8sClientRateLimit:
    qps: 20
    burst: 40
  operator:
    replicas: 2
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true

# --- CoreDNS (cluster DNS; k3s's packaged coredns is disabled) ---
debian_k3s_coredns_chart_version: "1.47.1"
debian_k3s_coredns_values:
  replicaCount: 3
  k8sAppLabelOverride: kube-dns
  service:
    name: kube-dns
    clusterIP: "{{ debian_k3s_cluster_dns }}"
  priorityClassName: system-cluster-critical
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              k8s-app: kube-dns
  podDisruptionBudget:
    minAvailable: 2
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists

# --- kube-vip (control-plane API VIP, ARP mode; static pod on all 3 servers) ---
debian_k3s_kube_vip_version: "v1.2.4"

# --- ArgoCD (GitOps controller for the app-of-apps/infra/apps tiers; installed by this role,
# everything it manages from here on is Tofu+ArgoCD, see infra2-app-of-apps-plan-draft.md) ---
# Reused rather than a dedicated token - "we can always update it" per Alex, 2026-09-27. Currently
# also feeds Komodo's periphery/admin BWS access on mac-mini-m4 and archlinux.
debian_k3s_bws_bitwarden_access_token_id: "bc877861-0217-476e-bb58-b417012e990b"  # komodo-dean-bws-access-token-ro
debian_k3s_bws_argocd_admin_password_id: "d373b795-6651-4bc9-9599-b37101245116"  # argocd-admin
# Fixed bcrypt salt (not secret - salts never are) so the hash is stable run to run; only the
# password value (from BWS) and this salt feed the hash, so re-runs stay idempotent.
debian_k3s_argocd_admin_password_salt: "NB7nb1S9NmykhpGnPhgCq."
# ArgoCD only re-applies admin.password when this mtime is newer than what's already in the live
# argocd-secret (its own anti-clobber mechanism against UI-driven password changes) - bump this by
# hand if the BWS secret's value is ever rotated, so the new password actually takes effect.
debian_k3s_argocd_admin_password_mtime: "2026-09-27T00:00:00Z"
debian_k3s_argocd_chart_version: "10.9.2"
debian_k3s_argocd_hostname: "argocd.amer.dev"
# letsencrypt-staging until the DNS-01 chain is validated end to end (see
# infra2-app-of-apps-background-draft.md); cut to letsencrypt-prod as a deliberate later step, not
# automatic. One place to flip it for everything Ansible-managed that references a cluster-issuer.
debian_k3s_cluster_issuer: "letsencrypt-staging"
debian_k3s_argocd_values:
  server:
    insecure: true   # plain HTTP/gRPC internally; Ingress below terminates TLS at the edge
    service:
      type: LoadBalancer   # Cilium L2, always on - reachable immediately post-bootstrap
    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: "{{ debian_k3s_cluster_issuer }}"
        external-dns.alpha.kubernetes.io/hostname: "{{ debian_k3s_argocd_hostname }}"
      hosts:
        - "{{ debian_k3s_argocd_hostname }}"
      tls:
        - secretName: argocd-server-tls
          hosts:
            - "{{ debian_k3s_argocd_hostname }}"
  configs:
    secret:
      argocdServerAdminPassword: "{{ debian_k3s_argocd_admin_password_hash.stdout }}"
      argocdServerAdminPasswordMtime: "{{ debian_k3s_argocd_admin_password_mtime }}"
    cm:
      # Chart default excludes both Endpoints and EndpointSlice cluster-wide. Our
      # infra/external-ingress Application (dean-tofu) backs external services (mac-mini-m4,
      # murderbot) with manually-created EndpointSlices, which ArgoCD then can't sync unless
      # EndpointSlice is allowed through. Endpoints stays excluded - same split k3s-dean-gitops
      # (legacy cluster) already used successfully, since v1 Endpoints is auto-generated by
      # kube-controller-manager for every selector-based Service and shouldn't be watched.
      resource.exclusions: |
        - apiGroups:
            - coordination.k8s.io
          kinds:
            - Lease
        - apiGroups:
            - authentication.k8s.io
            - authorization.k8s.io
          kinds:
            - SelfSubjectReview
            - TokenReview
            - LocalSubjectAccessReview
        - apiGroups:
            - ""
          kinds:
            - Endpoints
          clusters:
            - "*"
  # Single replica everywhere (controller/repo-server/server/redis) is the chart default already -
  # no redis-ha, no controller sharding. Alex, 2026-09-27: "if a node dies running argocd, a new
  # node will pick it up soon enough... a 5-20 minute outage, everything will be fine."
