---
# Hosts in [debian_k3s]. Role defaults live in roles/debian-k3s/defaults/main.yml.
# No secrets here - BWS only (these UUIDs are identifiers, not secrets).
ansible_user: alex
debian_k3s_user: "{{ ansible_user }}"

# BWS secrets (project: servers)
debian_k3s_bws_ssh_private_key_id: "fb0a8c45-a020-4c71-b92f-b44000fbac08"  # alex-id-ed25519-private-key
debian_k3s_bws_ssh_public_key_id: "79f4be07-afcf-48e2-b802-b44000fbc272"   # alex-id-ed25519-public-key

# Optional BWS secret UUID for the shared k3s join token. Empty -> k3s generates one on the
# init host and joiners read it from there.
debian_k3s_token_bws_id: ""

# Passwordless sudo for alex on these nodes (drop-in /etc/sudoers.d, visudo-validated).
debian_k3s_passwordless_sudo: false

# API VIP (kube-vip, added later) - in k3s tls-san so the serving cert is valid for it from the start.
# Lives in the "k3s Reserved" block 10.100.20.161-200 (outside DHCP .40-.160 and the legacy MetalLB pools .201-.250).
debian_k3s_api_vip: "10.100.20.161"
debian_k3s_extra_tls_sans:
  - "{{ debian_k3s_api_vip }}"

# --- Static IP + public DNS resolvers (codifies the existing DHCP reservation, see static-ip.yml) ---
# Matches the household convention already used for laptops/RPis (set-static-ip.yml, setup-rpi.yml).
debian_k3s_static_gateway: "10.100.20.1"
debian_k3s_static_netmask: "255.255.255.0"
debian_k3s_static_dns:
  - "1.1.1.1"
  - "8.8.8.8"

# --- Cilium (CNI, kube-proxy replacement, L2 LoadBalancer announcements) ---
debian_k3s_helm_version: "v3.21.0"
debian_k3s_cilium_cli_version: "v0.20.1"
debian_k3s_cilium_chart_version: "1.20.2"
debian_k3s_lb_pool_start: "10.100.20.170"
debian_k3s_lb_pool_stop: "10.100.20.189"
debian_k3s_lan_interface: lan0
debian_k3s_cilium_values:
  k8sServiceHost: "127.0.0.1"
  k8sServicePort: 6443
  kubeProxyReplacement: true
  ipam:
    mode: kubernetes
  routingMode: native
  ipv4NativeRoutingCIDR: "{{ debian_k3s_cluster_cidr }}"
  autoDirectNodeRoutes: true
  bpf:
    masquerade: true
  devices: "{{ debian_k3s_lan_interface }}"
  l2announcements:
    enabled: true
  externalIPs:
    enabled: false
  k8sClientRateLimit:
    qps: 20
    burst: 40
  operator:
    replicas: 2
  hubble:
    enabled: true
    relay:
      enabled: true
    ui:
      enabled: true

# --- CoreDNS (cluster DNS; k3s's packaged coredns is disabled) ---
debian_k3s_coredns_chart_version: "1.47.1"
debian_k3s_coredns_values:
  replicaCount: 3
  k8sAppLabelOverride: kube-dns
  service:
    name: kube-dns
    clusterIP: "{{ debian_k3s_cluster_dns }}"
  priorityClassName: system-cluster-critical
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              k8s-app: kube-dns
  podDisruptionBudget:
    minAvailable: 2
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: CriticalAddonsOnly
      operator: Exists

# --- kube-vip (control-plane API VIP, ARP mode; static pod on all 3 servers) ---
debian_k3s_kube_vip_version: "v1.2.4"
