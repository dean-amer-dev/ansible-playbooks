---
# Baseline + k3s HA server (embedded etcd) for the GMKtec Debian 13 boxes (group debian_k3s).
#   1. ssh keys from BWS   2. packages/sysctls   3. remove GUI + disable auto-sleep
#   4. performance power mode   5. LVM VG on all space past the OS partitions   6. k3s server
# CNI (Cilium), kube-vip, CoreDNS, ArgoCD are NOT here yet (need VIP / LB block decisions).
# With flannel disabled, nodes stay NotReady until Cilium is installed - expected.
#
# The ONLY secret input is BWS_ACCESS_TOKEN in the environment (never on the command line):
#   export BWS_ACCESS_TOKEN="$(cat /home/alex/claude/bws-ro-token)"
#   ansible-playbook -i inventory/inventory.ini playbooks/infrastructure/setup-debian-k3s.yml --limit gmktec-1
# Add --check --diff for a dry run. Tags: ssh_keys packages headless power storage k3s
# BWS is read on the control node only; the token is never sent to the hosts.
#
# First run on a fresh box: if alex's key is not installed yet, the run prompts ONCE for alex's
# ssh password (hidden), installs the BWS key with ssh-copy-id, then carries on. The password
# is also used as the sudo password if `sudo -n` doesn't work. Keys already installed -> no prompt.

- name: Fetch secrets from BWS (control node)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../../roles/debian-k3s/defaults/main.yml
  tasks:
    - name: Fail fast if BWS_ACCESS_TOKEN is not exported
      ansible.builtin.fail:
        msg: "BWS_ACCESS_TOKEN must be set in the environment"
      when: lookup('env', 'BWS_ACCESS_TOKEN') | length == 0

    - name: Fetch secrets
      ansible.builtin.command: bws secret get {{ item.id }} --output json
      loop:
        - { fact: debian_k3s_ssh_private_key, id: "{{ debian_k3s_bws_ssh_private_key_id }}" }
        - { fact: debian_k3s_ssh_public_key, id: "{{ debian_k3s_bws_ssh_public_key_id }}" }
      loop_control:
        label: "{{ item.fact }}"
      register: debian_k3s_bws
      changed_when: false
      no_log: true

    - name: Publish as facts
      ansible.builtin.set_fact:
        "{{ item.item.fact }}": "{{ (item.stdout | from_json).value }}"
      loop: "{{ debian_k3s_bws.results }}"
      loop_control:
        label: "{{ item.item.fact }}"
      no_log: true

    - name: Fetch shared join token (only if a BWS secret is configured)
      ansible.builtin.command: bws secret get {{ debian_k3s_token_bws_id }} --output json
      register: debian_k3s_token_raw
      changed_when: false
      no_log: true
      when: debian_k3s_token_bws_id | length > 0

    - name: Publish join token fact
      ansible.builtin.set_fact:
        debian_k3s_token: "{{ (debian_k3s_token_raw.stdout | from_json).value }}"
      no_log: true
      when: debian_k3s_token_bws_id | length > 0

# Bootstrap ssh key access. Runs on the control node, once per targeted host (respects --limit).
- name: Ensure key-based ssh works (prompt for password only if needed)
  hosts: debian_k3s
  connection: local
  gather_facts: false
  vars:
    ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/alex_id_ed25519"
    ssh_opts: >-
      -o StrictHostKeyChecking=no -o ConnectTimeout=10 -o BatchMode=yes
      -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -i {{ ssh_key }}
  tasks:
    - name: Probe key login
      ansible.builtin.command: ssh {{ ssh_opts }} {{ debian_k3s_user }}@{{ ansible_host }} true
      register: key_probe
      changed_when: false
      failed_when: false

    - name: Fail if the host is unreachable for a reason other than auth
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }} ({{ ansible_host }}): {{ key_probe.stderr | trim }}"
      when: key_probe.rc != 0 and 'Permission denied' not in key_probe.stderr

    - name: Probe passwordless sudo (only where key login works)
      ansible.builtin.command: ssh {{ ssh_opts }} {{ debian_k3s_user }}@{{ ansible_host }} sudo -n true
      register: sudo_probe
      changed_when: false
      failed_when: false
      when: key_probe.rc == 0

    - name: Work out who needs the password
      ansible.builtin.set_fact:
        key_missing: "{{ key_probe.rc != 0 }}"
        sudo_needs_password: "{{ key_probe.rc == 0 and sudo_probe.rc != 0 }}"

    - name: Prompt for alex's ssh password (hidden; asked once for all hosts)
      ansible.builtin.pause:
        prompt: "alex's ssh key is not installed (or sudo needs a password) - enter alex's password"
        echo: false
      run_once: true
      register: pw_prompt
      no_log: true
      when: ansible_play_hosts | map('extract', hostvars, 'key_missing') | select | list | length > 0
            or ansible_play_hosts | map('extract', hostvars, 'sudo_needs_password') | select | list | length > 0

    - name: Keep the password for sudo on this run only
      ansible.builtin.set_fact:
        ansible_become_password: "{{ pw_prompt.user_input }}"
      no_log: true
      when: pw_prompt.user_input is defined

    - name: Stage askpass helper and public key (control node, mode 0700)
      ansible.builtin.tempfile:
        state: directory
        prefix: ssh-bootstrap-
      register: boot_dir
      when: key_missing

    - name: Write helper that reads the password from the environment (nothing secret on disk)
      ansible.builtin.copy:
        dest: "{{ boot_dir.path }}/askpass"
        content: "#!/bin/sh\nprintf '%s\\n' \"$BOOTSTRAP_SSH_PASSWORD\"\n"
        mode: "0700"
      when: key_missing

    - name: Write public key to stage dir
      ansible.builtin.copy:
        dest: "{{ boot_dir.path }}/key.pub"
        content: "{{ hostvars['localhost'].debian_k3s_ssh_public_key | trim }}\n"
        mode: "0600"
      no_log: true
      when: key_missing

    - name: Install key with ssh-copy-id
      ansible.builtin.command: >-
        ssh-copy-id -f -i {{ boot_dir.path }}/key.pub
        -o StrictHostKeyChecking=no -o PubkeyAuthentication=no -o NumberOfPasswordPrompts=1
        {{ debian_k3s_user }}@{{ ansible_host }}
      environment:
        SSH_ASKPASS: "{{ boot_dir.path }}/askpass"
        SSH_ASKPASS_REQUIRE: force
        BOOTSTRAP_SSH_PASSWORD: "{{ pw_prompt.user_input }}"
      register: copy_id
      no_log: true
      when: key_missing

    - name: Remove stage dir
      ansible.builtin.file:
        path: "{{ boot_dir.path }}"
        state: absent
      when: key_missing

    - name: Verify key login now works
      ansible.builtin.command: ssh {{ ssh_opts }} {{ debian_k3s_user }}@{{ ansible_host }} true
      changed_when: false
      when: key_missing

# The init host must be fully up before joiners: one host at a time, init host first.
- name: Debian baseline + k3s server
  hosts: debian_k3s
  become: true
  gather_facts: true
  serial: 1
  roles:
    - role: "{{ playbook_dir }}/../../roles/debian-k3s"
